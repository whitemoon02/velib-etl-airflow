# Airflow en mode standalone (développement local) : http://localhost:8080
# Identifiants affichés dans les logs au premier démarrage :
#   docker compose logs airflow | grep -i password
services:
  airflow:
    image: apache/airflow:2.10.2-python3.12
    command: standalone
    ports: ["8080:8080"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
      _PIP_ADDITIONAL_REQUIREMENTS: "pandas pyarrow"
    volumes:
      - .:/opt/airflow/project
